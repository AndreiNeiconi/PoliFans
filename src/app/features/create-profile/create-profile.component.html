<div class="mb-4">
    <label class="form-label small fw-bold">Profile Assets</label>
    <div class="row g-3">
        <div class="col-md-6">
            <div class="upload-box p-3 border rounded-3 text-center bg-light">
                <img [src]="profile.profile_picture_url || 'https://api.dicebear.com/7.x/initials/svg?seed=P'"
                    class="rounded-circle mb-2 shadow-sm" width="80" height="80">
                <div class="mt-2">
                    <input type="file" #profileInput class="d-none" accept="image/*"
                        (change)="onFileChange($event, 'profile_picture_url')">
                    <button type="button" class="btn btn-sm btn-polifans rounded-pill px-3"
                        (click)="profileInput.click()">
                        <i class="bi bi-upload me-1"></i> Upload Avatar
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="upload-box p-3 border rounded-3 text-center bg-light">
                <div class="cover-preview mb-2 rounded"
                    [style.background-image]="'url(' + profile.cover_photo_url + ')'"
                    style="height: 80px; background-size: cover; background-color: #ddd;">
                    @if (!profile.cover_photo_url) {
                    <small class="text-muted d-block pt-4">No cover photo</small>
                    }
                </div>
                <input type="file" #coverInput class="d-none" accept="image/*"
                    (change)="onFileChange($event, 'cover_photo_url')">
                <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3"
                    (click)="coverInput.click()">
                    Choose Cover
                </button>
            </div>
        </div>
    </div>
</div>

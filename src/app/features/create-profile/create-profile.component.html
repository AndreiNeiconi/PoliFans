<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="pf-card p-4 p-md-5 shadow-lg">

                <div class="text-center mb-4">
                    <h2 class="fw-bold text-pf-primary">Complete Your Profile</h2>
                    <p class="text-muted">Tell the PoliFans community who you are.</p>
                </div>

                <form #profileForm="ngForm">

                    @if (currentStep === 1) {
                    <div class="step-animation">
                        <div class="mb-4 text-center">
                            <div class="profile-upload-circle mx-auto mb-3">
                                <i class="bi bi-camera fs-2"></i>
                            </div>
                            <label class="form-label d-block small fw-bold">Upload Profile Picture</label>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Headline</label>
                            <input type="text" name="headline" class="form-control"
                                placeholder="e.g. 3rd Year Automation Student" [(ngModel)]="profileData.headline"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Date of Birth</label>
                            <input type="date" name="dob" class="form-control" [(ngModel)]="profileData.date_of_birth"
                                required>
                        </div>
                    </div>
                    }

                    @if (currentStep === 2) {
                    <div class="step-animation">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Bio</label>
                            <textarea name="bio" class="form-control" rows="4"
                                placeholder="What are your academic interests?" [(ngModel)]="profileData.bio"
                                required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Skills (Comma separated)</label>
                            <input type="text" name="skills" class="form-control"
                                placeholder="Python, CAD, Project Management..." [(ngModel)]="profileData.skills">
                        </div>
                    </div>
                    }

                    <div class="d-flex justify-content-between mt-5">
                        <button type="button" class="btn btn-link text-decoration-none text-pf-primary"
                            (click)="prevStep()" [disabled]="currentStep === 1">Back</button>

                        @if (currentStep < totalSteps) { <button type="button" class="btn btn-polifans px-4"
                            (click)="nextStep()">Next Step</button>
                            } @else {
                            <button type="button" class="btn btn-success px-4 shadow" (click)="saveProfile()"
                                [disabled]="profileForm.invalid">Finish Setup</button>
                            }
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

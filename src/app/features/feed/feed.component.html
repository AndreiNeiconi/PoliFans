<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-10">

            <!-- Create Post Trigger -->
            <div class="pf-card p-3 mb-4 d-flex align-items-center gap-3">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=User" class="rounded-circle" width="45" alt="Avatar">
                <button class="btn btn-light flex-grow-1 text-start rounded-pill px-4 text-muted" routerLink="/post">
                    What are you working on, Andrei?
                </button>
            </div>

            <!-- Feed List -->
            @for (post of UserPost; track post.id_post) {
                <div class="pf-card mb-4 overflow-hidden">
                    <!-- Post Header -->
                    <div class="p-3 d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center gap-2">
                            @if(post.profile_picture_id){
                                <img [ngSrc]="getProfilePictureUrl(post.profile_picture_id) "
                        alt="Profile picture" class="rounded-circle border border-4 border-white shadow" width="120"
                        height="120">
                            <div>
                                <h6 class="mb-0 fw-bold">{{post.username}}</h6>
                                <small class="text-muted">{{getRelative_time(post.create_at)}}</small>
                            
                            </div> 
                            }@else{

                                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Andrei" alt="Default profile picture"
                        class="rounded-circle border border-4 border-white shadow" width="120" height="120">
                        <div>
                                <h6 class="mb-0 fw-bold">{{post.username}}</h6>
                                <small class="text-muted">{{getRelative_time(post.create_at)}}</small>
                            
                            </div> 
                            }
                            
                          
                        </div>
                        <button class="btn btn-link text-dark"><i class="bi bi-three-dots"></i></button>
                    </div>

                    <!-- Post Body -->
                    <div class="px-3 pb-3">
                        <h3><strong>{{ post.title }}</strong></h3>
                        <p>{{ post.content }}</p>
<!-- 
                        <div class="post-attachment p-4 rounded bg-light border d-flex align-items-center gap-3">
                            <i class="bi bi-file-earmark-zip-fill fs-2 text-primary"></i>
                            <div>
                                <div class="fw-bold">Exam_Project_v2.zip</div>
                                <small class="text-muted">14.5 MB</small>
                            </div>
                            <button class="btn btn-polifans btn-sm ms-auto">Download</button>
                        </div> -->
                    </div>

                    <!-- Post Actions -->
                    <div class="p-2 border-top d-flex justify-content-around">
                        <button class="btn btn-hover flex-grow-1"><i class="bi bi-heart me-2"></i> Like</button>
                        <button class="btn btn-hover flex-grow-1"><i class="bi bi-chat-left me-2"></i> Comment</button>
                        <button class="btn btn-hover flex-grow-1"><i class="bi bi-share me-2"></i> Share</button>
                    </div>
                </div>
            } @empty {
                <div class="col-12 text-center py-5">
                    <i class="bi bi-folder2-open display-4 text-muted"></i>
                    <p class="text-muted mt-2">No projects shared yet.</p>
                </div>
            }

        </div>
    </div>
</div>
